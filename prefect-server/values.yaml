ingress:
  enabled: true
  host:
    hostname: wri.dev.prefect.datopian.com
    path: /
    pathType: ImplementationSpecific
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: cert-manager
  tls: true
server:
  env:
  - name: PREFECT_UI_URL
    value: "https://wri.dev.prefect.datopian.com"