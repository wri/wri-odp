      if ($http_user_agent ~* "(woobot|woopingbot|worldwebheritage\.org|Wotbox|WPScan|WWWOFFLE|WWW-Mechanize|Xaldon\ WebSpider|XoviBot|yacybot|Yahoo|YandexBot|Yandex|YisouSpider|zermelo|Zeus|zh-CN|ZmEu|ZumBot|ZyBorg)") {
