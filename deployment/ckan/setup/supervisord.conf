[unix_http_server]
file = /srv/app/supervisor/supervisor.sock
chmod = 0777
chown = ckan:ckan

[supervisord]
directory = /srv/app/supervisor
logfile = /srv/app/supervisor/supervisord.log
logfile_maxbytes = 50MB
logfile_backups=10
loglevel = info
pidfile = /srv/app/supervisor/supervisord.pid
nodaemon = true
umask = 022
identifier = supervisor
environment=HOME="/srv/app/supervisor"

[supervisorctl]
serverurl = unix:///srv/app/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /srv/app/supervisor/supervisord.d/*.conf
