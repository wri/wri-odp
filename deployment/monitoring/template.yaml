# WRI ODP Monitoring Stack - Combined Values Template (template.yaml)
# This file uses {{VAR}} syntax for environment variable substitution
# 
# Charts:
#   - prometheus-community/kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
#   - grafana/loki-stack (Loki + Promtail)
#
# Generate values.yaml with: ./monitoring-values.sh

# ============================================================================
# KUBE-PROMETHEUS-STACK CONFIGURATION
# ============================================================================

fullnameOverride: prometheus

# Grafana configuration
grafana:
  enabled: true
  
  # Admin credentials
  adminPassword: "{{GRAFANA_ADMIN_PASSWORD}}"
  
  # Persistence (uses cluster default storage class)
  persistence:
    enabled: true
    size: {{GRAFANA_STORAGE_SIZE}}
  
  # Ingress configuration
  ingress:
    enabled: {{GRAFANA_INGRESS_ENABLED}}
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: {{CERT_MANAGER_ISSUER}}
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - {{GRAFANA_DOMAIN}}
    tls:
      - secretName: {{GRAFANA_DOMAIN}}-tls
        hosts:
          - {{GRAFANA_DOMAIN}}
  
  # Additional data sources (Loki)
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      isDefault: false
  
  # Default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  
  # Sidecar for dashboard provisioning
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

# Prometheus configuration
prometheus:
  enabled: true
  
  prometheusSpec:
    # Data retention
    retention: {{PROMETHEUS_RETENTION}}
    retentionSize: "{{PROMETHEUS_RETENTION_SIZE}}"
    
    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: {{PROMETHEUS_STORAGE_SIZE}}
    
    # Scrape configuration - collect from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    
    # Resources
    resources:
      requests:
        cpu: {{PROMETHEUS_CPU_REQUEST}}
        memory: {{PROMETHEUS_MEMORY_REQUEST}}
      limits:
        cpu: {{PROMETHEUS_CPU_LIMIT}}
        memory: {{PROMETHEUS_MEMORY_LIMIT}}
    
    # Additional scrape configs for custom targets
    additionalScrapeConfigs: []

    # Attached to all metrics and alerts — set per cluster at deploy time (e.g. ckan-dev, ckan-prod)
    externalLabels:
      cluster: "{{CLUSTER_NAME}}"

# Alertmanager configuration
alertmanager:
  enabled: {{ALERTMANAGER_ENABLED}}
  
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: {{ALERTMANAGER_STORAGE_SIZE}}
    
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  
  # Alertmanager config
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "{{SLACK_WEBHOOK_URL}}"
    route:
      group_by: ['alertname', 'namespace', 'cluster']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: '{{ALERT_RECEIVER}}'
      routes:
        - match:
            severity: critical
          receiver: '{{ALERT_RECEIVER}}'
    receivers:
      - name: 'null'
      - name: 'slack'
        slack_configs:
          - channel: '{{SLACK_CHANNEL}}'
            send_resolved: true
            # Color-code the Slack attachment: green when resolved, red for
            # firing criticals, yellow for firing warnings.
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.cluster }})'
            text: >-
              {{ range .Alerts }}
              *Cluster:* {{ .Labels.cluster }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Namespace:* {{ .Labels.namespace }}
              *Severity:* {{ .Labels.severity }}
              {{ end }}

# Node exporter for node metrics (DaemonSet - one pod per node)
nodeExporter:
  enabled: {{NODE_EXPORTER_ENABLED}}

# Kube-state-metrics for kubernetes object metrics
kubeStateMetrics:
  enabled: true

# Prometheus Operator
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Custom alerting rules for WRI ODP
additionalPrometheusRulesMap:
  wri-rules:
    groups:
      - name: wri-odp-alerts
        rules:
          # High memory usage
          - alert: HighMemoryUsage
            expr: |
              (sum by (namespace, pod) (container_memory_usage_bytes{namespace=~"wri-odp-.*"}) 
              / sum by (namespace, pod) (container_spec_memory_limit_bytes{namespace=~"wri-odp-.*"}) * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in {{ $labels.namespace }}"
              description: "Pod {{ $labels.pod }} is using {{ $value }}% of its memory limit"
          
          # Pod crash looping
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace=~"wri-odp-.*"}[15m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod crash looping in {{ $labels.namespace }}"
              description: "Pod {{ $labels.pod }} is crash looping"
          
          # High error rate (5xx responses)
          - alert: HighErrorRate
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5..", namespace=~"wri-odp-.*"}[5m])) 
              / sum(rate(nginx_ingress_controller_requests{namespace=~"wri-odp-.*"}[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5% for the last 5 minutes"
          
          # Pod not ready. Excludes Job/CronJob pods entirely (batch workloads
          # are expected to terminate, not stay ready) plus any pod in a
          # terminal Succeeded/Failed phase, so completed cronjob runs don't alert.
          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{condition="true", namespace=~"wri-odp-.*"} == 0
              unless on (namespace, pod) kube_pod_owner{owner_kind="Job", namespace=~"wri-odp-.*"}
              unless on (namespace, pod) kube_pod_status_phase{phase=~"Succeeded|Failed", namespace=~"wri-odp-.*"} == 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod not ready in {{ $labels.namespace }} ({{ $labels.cluster }})"
              description: "Pod {{ $labels.pod }} has been not ready for more than 10 minutes"

# ============================================================================
# LOKI-STACK CONFIGURATION (for separate helm install)
# ============================================================================
# Note: This section is used when installing loki-stack separately
# The values below are passed to: helm install loki grafana/loki-stack -f <extracted-loki-values>

loki-stack:
  loki:
    enabled: true
    
    persistence:
      enabled: true
      size: {{LOKI_STORAGE_SIZE}}
    
    config:
      auth_enabled: false
      
      ingester:
        chunk_idle_period: 3m
        chunk_block_size: 262144
        chunk_retain_period: 1m
        max_transfer_retries: 0
        lifecycler:
          ring:
            kvstore:
              store: inmemory
            replication_factor: 1
      
      limits_config:
        enforce_metric_name: false
        reject_old_samples: true
        reject_old_samples_max_age: {{LOKI_RETENTION}}
        retention_period: {{LOKI_RETENTION}}
        max_entries_limit_per_query: 5000
      
      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h
      
      storage_config:
        boltdb_shipper:
          active_index_directory: /data/loki/boltdb-shipper-active
          cache_location: /data/loki/boltdb-shipper-cache
          cache_ttl: 24h
          shared_store: filesystem
        filesystem:
          directory: /data/loki/chunks
      
      compactor:
        working_directory: /data/loki/boltdb-shipper-compactor
        shared_store: filesystem
        retention_enabled: true
        retention_delete_delay: 2h
        compaction_interval: 10m
      
      chunk_store_config:
        max_look_back_period: 0s
      
      table_manager:
        retention_deletes_enabled: true
        retention_period: {{LOKI_RETENTION}}
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  promtail:
    enabled: true
    
    # Use default promtail config - it auto-discovers pods and collects logs
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  grafana:
    enabled: false

  prometheus:
    enabled: false

  fluent-bit:
    enabled: false

  filebeat:
    enabled: false

  logstash:
    enabled: false
