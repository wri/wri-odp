    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/ckan-backend-dev/src/ckanext-wri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
