version: 2
updates:
  # npm
  - package-ecosystem: "npm"
    directory: "/deployment/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/e2e-tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/integration-tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # pip
  - package-ecosystem: "pip"
    directory: "/datapusher"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
