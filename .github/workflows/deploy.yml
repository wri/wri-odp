name: Deploy to AWS

on:
  workflow_call:
    inputs:
      branch_name:
        description: 'Target branch/environment (dev, staging, prod)'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Target environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PROJECT_NAME: wri-odp

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.branch_name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.branch_name }}
    env:
      BRANCH_NAME: ${{ inputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Resolve image tags from ECR latest
        id: resolve-tags
        env:
          CKAN_REPO: ${{ secrets.ECR_CKAN_REPO }}
          FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
          DATAPUSHER_REPO: ${{ secrets.ECR_DATAPUSHER_REPO }}
        run: |
          # Function to resolve the SHA tag from a latest tag in ECR
          # This ensures we always deploy images that actually exist
          resolve_sha_from_latest() {
            local repo=$1
            local latest_tag=$2
            local sha_pattern=$3  # regex pattern to match SHA tag
            local fallback_tag=$4
            
            echo "Resolving SHA for $repo from tag $latest_tag..." >&2
            
            # Get the digest of the latest tag
            DIGEST=$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageTag="$latest_tag" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$DIGEST" ] || [ "$DIGEST" == "None" ]; then
              echo "::warning::Could not find image with tag $latest_tag in $repo, using fallback: $fallback_tag" >&2
              echo "$fallback_tag"
              return
            fi
            
            # Get all tags for this digest
            TAGS=$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageDigest="$DIGEST" \
              --query 'imageDetails[0].imageTags' \
              --output text 2>/dev/null || echo "")
            
            echo "  Found tags: $TAGS" >&2
            
            # Find the SHA tag using the provided pattern
            SHA_TAG=$(echo "$TAGS" | tr '\t' '\n' | grep -E "$sha_pattern" | head -1)
            
            if [ -z "$SHA_TAG" ]; then
              echo "::warning::Could not find SHA tag matching pattern, using fallback: $fallback_tag" >&2
              echo "$fallback_tag"
              return
            fi
            
            echo "  Resolved: $SHA_TAG" >&2
            echo "$SHA_TAG"
          }
          
          echo "=============================================="
          echo "Resolving image tags from ECR latest tags"
          echo "Branch: $BRANCH_NAME"
          echo "=============================================="
          echo ""
          
          # Resolve CKAN (pattern: branch-sha, no suffix)
          CKAN_TAG=$(resolve_sha_from_latest "$CKAN_REPO" "${BRANCH_NAME}-latest" "^${BRANCH_NAME}-[a-f0-9]{40}$" "${BRANCH_NAME}-latest")
          
          # Resolve Frontend (pattern: branch-sha, no suffix)
          FRONTEND_TAG=$(resolve_sha_from_latest "$FRONTEND_REPO" "${BRANCH_NAME}-latest" "^${BRANCH_NAME}-[a-f0-9]{40}$" "${BRANCH_NAME}-latest")
          
          # Resolve Datapusher (pattern: branch-sha-datapusher)
          DATAPUSHER_TAG=$(resolve_sha_from_latest "$DATAPUSHER_REPO" "${BRANCH_NAME}-latest-datapusher" "^${BRANCH_NAME}-[a-f0-9]{40}-datapusher$" "${BRANCH_NAME}-latest-datapusher")
          
          # Resolve Migration (pattern: branch-sha-migration)
          MIGRATION_TAG=$(resolve_sha_from_latest "$DATAPUSHER_REPO" "${BRANCH_NAME}-latest-migration" "^${BRANCH_NAME}-[a-f0-9]{40}-migration$" "${BRANCH_NAME}-latest-migration")
          
          echo ""
          echo "=== Resolved Image Tags ==="
          echo "CKAN:       $CKAN_TAG"
          echo "Frontend:   $FRONTEND_TAG"
          echo "Datapusher: $DATAPUSHER_TAG"
          echo "Migration:  $MIGRATION_TAG"
          echo ""
          
          echo "ckan_tag=$CKAN_TAG" >> $GITHUB_OUTPUT
          echo "frontend_tag=$FRONTEND_TAG" >> $GITHUB_OUTPUT
          echo "datapusher_tag=$DATAPUSHER_TAG" >> $GITHUB_OUTPUT
          echo "migration_tag=$MIGRATION_TAG" >> $GITHUB_OUTPUT

      - name: Run Templater and update values.yaml
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          CKAN_REPO: ${{ secrets.ECR_CKAN_REPO }}
          FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
          DATAPUSHER_REPO: ${{ secrets.ECR_DATAPUSHER_REPO }}
          CKAN_IMAGE_TAG: ${{ steps.resolve-tags.outputs.ckan_tag }}
          FRONTEND_IMAGE_TAG: ${{ steps.resolve-tags.outputs.frontend_tag }}
          DATAPUSHER_IMAGE_TAG: ${{ steps.resolve-tags.outputs.datapusher_tag }}
          MIGRATION_IMAGE_TAG: ${{ steps.resolve-tags.outputs.migration_tag }}
        run: |
          cd deployment
          curl -sS https://raw.githubusercontent.com/datopian/devops-tools/master/scripts/templater.sh > /tmp/templater.sh
          
          echo "Deploying with image tags:"
          echo "  CKAN:       $CKAN_IMAGE_TAG"
          echo "  Frontend:   $FRONTEND_IMAGE_TAG"
          echo "  Datapusher: $DATAPUSHER_IMAGE_TAG"
          echo "  Migration:  $MIGRATION_IMAGE_TAG"
          
          bash /tmp/templater.sh helm-templates/values.yaml.$BRANCH_NAME.template > helm-templates/values.yaml
          
          echo ""
          echo "=== Generated image tags in values.yaml ==="
          grep -E "^\s+tag:" helm-templates/values.yaml | head -10

      - name: Configure Kubeconfig
        run: |
          echo "Deploying to: $BRANCH_NAME"
          mkdir -p /home/runner/.kube
          aws eks --region ${{ secrets.AWS_REGION }} update-kubeconfig --name ${{ secrets.CLUSTER_NAME }} --role-arn ${{ secrets.KUBEROLE }}
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy using Helm Upgrade
        run: |
          set -e
          helm upgrade -i dx-helm-wri-$BRANCH_NAME-release ./deployment/helm-templates \
            -f ./deployment/helm-templates/values.yaml \
            -n $PROJECT_NAME-$BRANCH_NAME \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Show deployment status
        if: always()
        run: |
          echo "=== Deployment Status ==="
          helm status dx-helm-wri-$BRANCH_NAME-release -n $PROJECT_NAME-$BRANCH_NAME || true
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n $PROJECT_NAME-$BRANCH_NAME -o wide || true
