name: Build and Deploy to AWS
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
env:
  PROJECT_NAME: wri-odp
  BRANCH_NAME: dev
  ENABLE_TRIVY_SCANNING: true
  ENABLE_BUILD_CKAN: true
  ENABLE_BUILD_FRONTEND: true
  ENABLE_BUILD_DATAPUSHER: true
  ENABLE_BUILD_MIGRATION: true
  ENABLE_INT_TESTS: true
  ENABLE_UNIT_TESTS: true
  ENABLE_FRONTEND_TESTS: true
  ENABLE_DEBUG_LOGS: false
  ENABLE_FRONTEND_DOCKER: true
permissions:
  id-token: write
  contents: read
  security-events: write
jobs:
  build-ckan:
    name: Build CKAN Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare CKAN build context
        run: mv ckan-backend-dev/src/ckanext-wri deployment/ckan/
      - name: Build and push CKAN image to ECR
        uses: docker/build-push-action@v5
        with:
          context: deployment/ckan
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_CKAN_REPO }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=ckan
          cache-to: type=gha,mode=max,scope=ckan

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Frontend image to ECR
        uses: docker/build-push-action@v5
        with:
          context: deployment/frontend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:dev-${{ github.sha }}
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.DEV_FRONTEND_NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.DEV_FRONTEND_NEXTAUTH_URL }}
            CKAN_URL=${{ secrets.DEV_FRONTEND_CKAN_URL }}
            NEXT_PUBLIC_CKAN_URL=${{ secrets.DEV_FRONTEND_CKAN_URL }}
            NEXT_PUBLIC_NEXTAUTH_URL=${{ secrets.DEV_FRONTEND_NEXTAUTH_URL }}
            NEXT_PUBLIC_GTM_ID=${{ secrets.DEV_NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_HOTJAR_ID=${{ secrets.DEV_NEXT_PUBLIC_HOTJAR_ID }}
            NEXT_PUBLIC_DISABLE_HOTJAR=disabled
            NEXT_PUBLIC_GFW_API_KEY=${{ secrets.NEXT_PUBLIC_GFW_API_KEY }}
            OSANO_URL=${{ secrets.DEV_OSANO_URL }}
            NEXT_PUBLIC_DEPLOYMENT_TYPE=dev
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-datapusher:
    name: Build Datapusher Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Datapusher image to ECR
        uses: docker/build-push-action@v5
        with:
          context: datapusher
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=datapusher
          cache-to: type=gha,mode=max,scope=datapusher

  build-migration:
    name: Build Migration Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Migration image to ECR
        uses: docker/build-push-action@v5
        with:
          context: migration
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-migration
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

  build-prefect:
    name: Build Prefect Server Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Prefect image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ckan-backend-dev/prefect-server
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-prefect
          cache-from: type=gha,scope=prefect-server
          cache-to: type=gha,mode=max,scope=prefect-server

  build-postgresql:
    name: Build PostgreSQL Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push PostgreSQL image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ckan-backend-dev/postgresql
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-postgresql
          cache-from: type=gha,scope=postgresql
          cache-to: type=gha,mode=max,scope=postgresql

  build-solr:
    name: Build Solr Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Solr image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ckan-backend-dev/solr
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-solr
          cache-from: type=gha,scope=solr
          cache-to: type=gha,mode=max,scope=solr

  test-integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: [build-ckan, build-frontend, build-datapusher, build-migration, build-prefect, build-postgresql, build-solr]
    if: always() && (needs.build-ckan.result == 'success' || needs.build-ckan.result == 'skipped')
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set image environment variables
        run: |
          echo "CKAN_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_CKAN_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "DATAPUSHER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "PREFECT_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-prefect" >> $GITHUB_ENV
          echo "POSTGRESQL_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-postgresql" >> $GITHUB_ENV
          echo "SOLR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-solr" >> $GITHUB_ENV
          echo "SCRIPT_NAME=/private-admin" >> $GITHUB_ENV
          echo "OSANO_URL=${{ secrets.DEV_OSANO_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CKAN_URL=${{ secrets.DEV_FRONTEND_CKAN_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_NEXTAUTH_URL=${{ secrets.DEV_FRONTEND_NEXTAUTH_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GTM_ID=${{ secrets.DEV_NEXT_PUBLIC_GTM_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_HOTJAR_ID=${{ secrets.DEV_NEXT_PUBLIC_HOTJAR_ID }}" >> $GITHUB_ENV
      - name: Add url(s) to hosts
        run: |
          sudo echo "127.0.0.1 ckan-dev" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 frontend" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 prefect" | sudo tee -a /etc/hosts
      - name: Set up Docker Containers
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.example up -d
        working-directory: ./ckan-backend-dev
      - name: Cypress Install and CKAN setup
        if: ${{ env.ENABLE_INT_TESTS == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:5000/private-admin/en'
          wait-on-timeout: 120
          runTests: false
          working-directory: ./integration-tests
      - name: Create sysadmin API for Authorization
        run: bash ./ckan-backend-dev/ckan/scripts/cypress_setup.sh
      - name: Restart Frontend with updated API token
        if: ${{ env.ENABLE_FRONTEND_DOCKER == 'true' }}
        run: docker compose -f docker-compose.test.yml --env-file .env.example restart frontend
        working-directory: ./ckan-backend-dev
      - name: Print Logs
        if: ${{ env.ENABLE_DEBUG_LOGS == 'true' }}
        run: docker compose -f docker-compose.test.yml --env-file .env.example logs
        working-directory: ./ckan-backend-dev
      - name: Cypress Install and Frontend setup
        if: ${{ env.ENABLE_INT_TESTS == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 60
          runTests: false
          working-directory: ./e2e-tests
      - name: Initialize the Extensions
        run: bash ./ckan-backend-dev/ckan/scripts/init-extensions.sh
      - name: Run Integration tests 🧪
        if: ${{ env.ENABLE_INT_TESTS == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          command: node test.js
          working-directory: ./integration-tests
      - name: Check prefect url
        uses: jtalk/url-health-check-action@v4
        with:
          # Check the following URLs one by one sequentially
          url: http://prefect:4200
          # Follow redirects, or just report success on 3xx status codes
          follow-redirect: false # Optional, defaults to "false"
          # Fail this action after this many failed attempts
          max-attempts: 3 # Optional, defaults to 1
      - name: Print Error Logs
        if: failure()
        run: docker compose -f docker-compose.test.yml --env-file .env.example logs
        working-directory: ./ckan-backend-dev
      - name: Tear down containers
        if: failure() || success()
        run: docker compose -f docker-compose.test.yml --env-file .env.example down -v --remove-orphans
        working-directory: ./ckan-backend-dev

  test-unit:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [build-ckan, build-frontend, build-datapusher, build-migration, build-prefect, build-postgresql, build-solr]
    if: always() && (needs.build-ckan.result == 'success' || needs.build-ckan.result == 'skipped')
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set image environment variables
        run: |
          echo "CKAN_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_CKAN_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "DATAPUSHER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "PREFECT_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-prefect" >> $GITHUB_ENV
          echo "POSTGRESQL_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-postgresql" >> $GITHUB_ENV
          echo "SOLR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-solr" >> $GITHUB_ENV
          echo "SCRIPT_NAME=/private-admin" >> $GITHUB_ENV
          echo "OSANO_URL=${{ secrets.DEV_OSANO_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CKAN_URL=${{ secrets.DEV_FRONTEND_CKAN_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_NEXTAUTH_URL=${{ secrets.DEV_FRONTEND_NEXTAUTH_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GTM_ID=${{ secrets.DEV_NEXT_PUBLIC_GTM_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_HOTJAR_ID=${{ secrets.DEV_NEXT_PUBLIC_HOTJAR_ID }}" >> $GITHUB_ENV
      - name: Add url(s) to hosts
        run: |
          sudo echo "127.0.0.1 ckan-dev" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 frontend" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 prefect" | sudo tee -a /etc/hosts
      - name: Set up Docker Containers
        run: |
          docker compose -f docker-compose.test.yml --env-file .env.example up -d
        working-directory: ./ckan-backend-dev
      - name: Wait for CKAN to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:5000/private-admin/en > /dev/null 2>&1; do sleep 2; done'
      - name: Copy run_unit_tests.sh
        run: docker cp ./ckan/scripts/run_unit_tests.sh ckan-wri:/srv/app/run_unit_tests.sh
        working-directory: ./ckan-backend-dev
      - name: Copy s3filestore test.ini fix script for minio
        run: |
          docker cp ./ckan/scripts/fix_s3filestore_test_ini.sh ckan-wri:/srv/app/fix_s3filestore_test_ini.sh
        working-directory: ./ckan-backend-dev
      - name: Fix s3filestore test.ini for minio
        run: docker compose -f docker-compose.test.yml --env-file .env.example exec -T ckan-dev /bin/bash -c "/srv/app/fix_s3filestore_test_ini.sh"
        working-directory: ./ckan-backend-dev
      - name: Initialize extension tables
        run: |
          docker exec ckan-wri sh -c "ckan -c production.ini issuesdb"
          docker exec ckan-wri sh -c "ckan -c production.ini downloadeventdb"
          docker exec ckan-wri sh -c "ckan -c production.ini notificationdb"
          docker exec ckan-wri sh -c "ckan -c production.ini pendingdatasetsdb"
          docker exec ckan-wri sh -c "ckan -c production.ini resourcelocationdb"
          docker exec ckan-wri sh -c "ckan -c production.ini db upgrade -p harvest"
      - name: Run Unit Tests 🧪
        run: docker compose -f docker-compose.test.yml --env-file .env.example exec -T ckan-dev /bin/bash -c "/srv/app/run_unit_tests.sh"
        working-directory: ./ckan-backend-dev
        timeout-minutes: 10
      - name: Print Error Logs
        if: failure()
        run: docker compose -f docker-compose.test.yml --env-file .env.example logs
        working-directory: ./ckan-backend-dev
      - name: Tear down containers
        if: failure() || success()
        run: docker compose -f docker-compose.test.yml --env-file .env.example down -v --remove-orphans
        working-directory: ./ckan-backend-dev

  test-frontend:
    name: Run Frontend E2E Tests (Group ${{ matrix.group }})
    runs-on: ubuntu-latest
    if: always() && (needs.build-ckan.result == 'success' || needs.build-ckan.result == 'skipped')
    needs: [build-ckan, build-frontend, build-datapusher, build-migration, build-prefect, build-postgresql, build-solr]
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Set image environment variables
        run: |
          echo "CKAN_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_CKAN_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "DATAPUSHER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}" >> $GITHUB_ENV
          echo "PREFECT_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-prefect" >> $GITHUB_ENV
          echo "POSTGRESQL_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-postgresql" >> $GITHUB_ENV
          echo "SOLR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_DATAPUSHER_REPO }}:dev-${{ github.sha }}-solr" >> $GITHUB_ENV
          echo "SCRIPT_NAME=/private-admin" >> $GITHUB_ENV
          echo "OSANO_URL=${{ secrets.DEV_OSANO_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CKAN_URL=${{ secrets.DEV_FRONTEND_CKAN_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_NEXTAUTH_URL=${{ secrets.DEV_FRONTEND_NEXTAUTH_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GTM_ID=${{ secrets.DEV_NEXT_PUBLIC_GTM_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_HOTJAR_ID=${{ secrets.DEV_NEXT_PUBLIC_HOTJAR_ID }}" >> $GITHUB_ENV
      - name: Add url(s) to hosts
        run: |
          sudo echo "127.0.0.1 ckan-dev" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 frontend" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 prefect" | sudo tee -a /etc/hosts
      - name: Set up Docker Containers
        run: |
          # Start all containers except frontend (it will be started after API token is created)
          docker compose -f docker-compose.test.yml --env-file .env.example up -d ckan-dev db solr redis datapusher minio prefect
        working-directory: ./ckan-backend-dev
      - name: Wait for CKAN to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:5000/private-admin/en > /dev/null 2>&1; do sleep 2; done'
      - name: Create sysadmin API for Authorization
        run: bash ./ckan-backend-dev/ckan/scripts/cypress_setup.sh
      - name: Start Frontend with API token
        if: ${{ env.ENABLE_FRONTEND_DOCKER == 'true' }}
        run: docker compose -f docker-compose.test.yml --env-file .env.example up -d frontend
        working-directory: ./ckan-backend-dev
      - name: Cypress Install and Frontend setup
        if: ${{ env.ENABLE_FRONTEND_TESTS == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          runTests: false
          working-directory: ./e2e-tests
      - name: Initialize the Extensions
        run: bash ./ckan-backend-dev/ckan/scripts/init-extensions.sh
      - name: Run frontend tests group ${{ matrix.group }} 🧪
        if: ${{ env.ENABLE_FRONTEND_TESTS == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:group${{ matrix.group }}
          working-directory: ./e2e-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-group-${{ matrix.group }}
          path: /home/runner/work/wri-odp/wri-odp/e2e-tests/cypress/screenshots
          if-no-files-found: ignore
      - name: Print Error Logs
        if: failure()
        run: docker compose -f docker-compose.test.yml --env-file .env.example logs
        working-directory: ./ckan-backend-dev
      - name: Tear down containers
        if: failure() || success()
        run: docker compose -f docker-compose.test.yml --env-file .env.example down -v --remove-orphans
        working-directory: ./ckan-backend-dev

  trivy-ckan:
    name: Trivy Security Scan - CKAN
    runs-on: ubuntu-latest
    needs: [build-ckan]
    if: always() && needs.build-ckan.result == 'success'
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Run Trivy Vulnerability Scanner for CKAN Container 🧪
        uses: aquasecurity/trivy-action@master
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_CKAN_REPO }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.REPOSITORY }}:dev-${{ github.sha }}'
          format: 'sarif'
          output: ckan-trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Upload CKAN container Trivy scan results to GitHub Code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ckan-trivy-results.sarif

  trivy-frontend:
    name: Trivy Security Scan - Frontend
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: always() && needs.build-frontend.result == 'success'
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Run Trivy Vulnerability Scanner for Frontend Container 🧪
        uses: aquasecurity/trivy-action@master
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_FRONTEND_REPO }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.REPOSITORY }}:dev-${{ github.sha }}'
          format: 'sarif'
          output: frontend-trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Upload Frontend container Trivy scan results to GitHub Code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: frontend_container_trivy_results
          sarif_file: frontend-trivy-results.sarif

  deploy:
    name: Deploy To AWS
    runs-on: ubuntu-latest
    needs: [build-ckan, build-frontend, build-datapusher, build-migration, build-prefect, build-postgresql, build-solr, test-integration, test-unit, test-frontend, trivy-ckan, trivy-frontend]
    if: github.event_name != 'pull_request' && always() && (needs.test-integration.result == 'success' || needs.test-integration.result == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'
      - name: Run Templater and update values.yaml
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          CKAN_REPO: ${{ secrets.ECR_CKAN_REPO}}
          FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO}}
          DATAPUSHER_REPO: ${{ secrets.ECR_DATAPUSHER_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd deployment
          curl https://raw.githubusercontent.com/datopian/devops-tools/master/scripts/templater.sh > /tmp/templater.sh
          bash /tmp/templater.sh helm-templates/values.yaml.$BRANCH_NAME.template > helm-templates/values.yaml
      - name: Configure Kubeconfig
        run: |
          echo $BRANCH_NAME
          mkdir -p /home/runner/.kube
          aws eks --region ${{ secrets.AWS_REGION }} update-kubeconfig --name ${{ secrets.CLUSTER_NAME }} --role-arn ${{ secrets.KUBEROLE }}
          chmod 600 ~/.kube/config
        env:
          GITHUB_SHA: '${{ github.sha }}'
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Deploy using Helm Upgrade'
        run: |
          set -e
          helm upgrade -i dx-helm-wri-$BRANCH_NAME-release ./deployment/helm-templates -f ./deployment/helm-templates/values.yaml -n $PROJECT_NAME-$BRANCH_NAME --create-namespace --wait
