name: Build and Push Solr Image

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
  push:
    paths:
      - 'ckan-backend-dev/solr/**'
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to tag (e.g., dev, staging, prod)'
        required: true
        default: 'dev'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-solr:
    name: Build and Push Solr
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
        # Don't specify ref - defaults to merge commit for PRs (includes PR changes)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build and push Solr image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DATAPUSHER_REPO: ${{ secrets.ECR_DATAPUSHER_REPO }}
          IMAGE_TAG: ${{ inputs.branch_name || github.ref_name }}-${{ github.sha }}
          LATEST_TAG: ${{ inputs.branch_name || github.ref_name }}-latest-solr
        run: |
          docker build -t $REGISTRY/$DATAPUSHER_REPO:$IMAGE_TAG-solr \
          ckan-backend-dev/solr
          
          docker push $REGISTRY/$DATAPUSHER_REPO:$IMAGE_TAG-solr
          
          # Only push 'latest' tag if this is NOT a Pull Request
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker tag $REGISTRY/$DATAPUSHER_REPO:$IMAGE_TAG-solr $REGISTRY/$DATAPUSHER_REPO:$LATEST_TAG
            docker push $REGISTRY/$DATAPUSHER_REPO:$LATEST_TAG
            echo "Successfully pushed $LATEST_TAG"
          else
            echo "Skipping 'latest' tag push for Pull Request"
          fi
          
          echo "Successfully pushed solr image"
