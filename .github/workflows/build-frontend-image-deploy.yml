name: Build and Push Frontend Image for Deployment

on:
  workflow_call:
    inputs:
      branch_name:
        description: 'Branch name to tag (e.g., dev, staging, prod)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to tag (e.g., dev, staging, prod)'
        required: true
        default: 'dev'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-frontend:
    name: Build and Push Frontend Image for Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Set env prefix for workflow_dispatch
        id: prefix
        run: |
          BRANCH="${{ inputs.branch_name || github.ref_name }}"
          if [ "$BRANCH" == "prod" ]; then echo "val=PROD" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "staging" ]; then echo "val=STAGING" >> $GITHUB_OUTPUT
          else echo "val=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO }}
          IMAGE_TAG: ${{ github.sha }}-${{ inputs.branch_name || github.ref_name }}
          LATEST_TAG: ${{ inputs.branch_name || github.ref_name }}
          NEXT_PUBLIC_GTM_ID: ${{ vars[format('{0}_NEXT_PUBLIC_GTM_ID', steps.prefix.outputs.val)] }}
          NEXT_PUBLIC_HOTJAR_ID: ${{ vars[format('{0}_NEXT_PUBLIC_HOTJAR_ID', steps.prefix.outputs.val)] }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
          FRONTEND_NEXTAUTH_URL: ${{ vars[format('{0}_FRONTEND_NEXTAUTH_URL', steps.prefix.outputs.val)] }}
          FRONTEND_CKAN_URL: ${{ vars[format('{0}_FRONTEND_CKAN_URL', steps.prefix.outputs.val)] }}
        run: |
          docker build \
            --network host \
            --build-arg NEXTAUTH_SECRET="dummy-secret-for-build" \
            --build-arg NEXTAUTH_URL="http://wri-frontend:3000" \
            --build-arg CKAN_URL="${FRONTEND_CKAN_URL:-http://ckan-dev:5000/private-admin/en}" \
            --build-arg NEXT_PUBLIC_CKAN_URL="${FRONTEND_CKAN_URL:-http://ckan-dev:5000/private-admin/en}" \
            --build-arg NEXT_PUBLIC_NEXTAUTH_URL="${FRONTEND_NEXTAUTH_URL:-http://localhost:3000}" \
            --build-arg NEXT_PUBLIC_GTM_ID="${NEXT_PUBLIC_GTM_ID:-dummy-gtm-id}" \
            --build-arg NEXT_PUBLIC_DISABLE_HOTJAR="enabled" \
            --build-arg NEXT_PUBLIC_HOTJAR_ID="${NEXT_PUBLIC_HOTJAR_ID:-dummy-hotjar-id}" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.dummy_mapbox_token}" \
            --build-arg OSANO_URL="YOUR_OSANO_URL/osano.js" \
            --build-arg NEXT_PUBLIC_DEPLOYMENT_TYPE="${{ inputs.branch_name || github.ref_name }}" \
            --build-arg SYS_ADMIN_API_KEY=${{ env.SYS_ADMIN_API_KEY }} \
            -t $REGISTRY/$FRONTEND_REPO:$IMAGE_TAG \
            -t $REGISTRY/$FRONTEND_REPO:$LATEST_TAG \
            deployment/frontend

          docker push $REGISTRY/$FRONTEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$FRONTEND_REPO:$LATEST_TAG
