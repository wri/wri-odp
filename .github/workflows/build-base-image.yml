name: Build and Push CKAN Base Image to ECR

on:
  push:
    paths:
      - 'deployment/ckan/Dockerfile.base'
      - 'deployment/ckan/patches/**'
      - 'deployment/ckan/setup/**'
      - 'deployment/ckan/docker-entrypoint.d/**'
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-base:
    name: Build and Push CKAN Base Image
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build and push CKAN Base image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_CKAN_BASE_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -f deployment/ckan/Dockerfile.base -t $REGISTRY/$REPOSITORY:$IMAGE_TAG deployment/ckan
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
