name: Build and Push Frontend Image

on:
  workflow_dispatch:
    inputs:
      branch_name:
        required: true
        type: string
      
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      datapusher_changed:
        required: false
        type: string
        default: 'false'
      ckan_changed:
        required: false
        type: string
        default: 'false'
      prefect_changed:
        required: false
        type: string
        default: 'false'
      solr_changed:
        required: false
        type: string
        default: 'false'
      pr_number:
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Set image environment variables
        run: |
          BRANCH="${{ inputs.branch_name || github.ref_name }}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          PR_NUMBER="${{ inputs.pr_number }}"

          if [ -n "$PR_NUMBER" ]; then
            FRONTEND_TAG="${BRANCH}-${PR_NUMBER}-test"
          else
            FRONTEND_TAG="${BRANCH}-test"
          fi

          # FRONTEND_IMAGE is set for docker-compose validation (we're building it, not pulling)
          echo "FRONTEND_IMAGE=$REGISTRY/${{ vars.ECR_FRONTEND_REPO }}:$FRONTEND_TAG" >> $GITHUB_ENV
          
          # Use latest tags for all containers when triggered via workflow_dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "CKAN_IMAGE=$REGISTRY/${{ vars.ECR_CKAN_REPO }}:$BRANCH" >> $GITHUB_ENV
            echo "DATAPUSHER_IMAGE=$REGISTRY/${{ vars.ECR_DATAPUSHER_REPO }}:$BRANCH" >> $GITHUB_ENV
            echo "PREFECT_IMAGE=$REGISTRY/${{ vars.ECR_PREFECT_REPO }}:$BRANCH" >> $GITHUB_ENV
            echo "POSTGRESQL_IMAGE=$REGISTRY/${{ vars.ECR_POSTGRESQL_REPO }}:$BRANCH" >> $GITHUB_ENV
            echo "SOLR_IMAGE=$REGISTRY/${{ vars.ECR_SOLR_REPO }}:$BRANCH" >> $GITHUB_ENV
          else
            # Use SHA-tagged images when called from workflow_call
            if [ "${{ inputs.ckan_changed }}" == "true" ]; then
              echo "CKAN_IMAGE=$REGISTRY/${{ vars.ECR_CKAN_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
            else
              echo "CKAN_IMAGE=$REGISTRY/${{ vars.ECR_CKAN_REPO }}:$BRANCH" >> $GITHUB_ENV
            fi
            if [ "${{ inputs.datapusher_changed }}" == "true" ]; then
              echo "DATAPUSHER_IMAGE=$REGISTRY/${{ vars.ECR_DATAPUSHER_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
            else
              echo "DATAPUSHER_IMAGE=$REGISTRY/${{ vars.ECR_DATAPUSHER_REPO }}:$BRANCH" >> $GITHUB_ENV
            fi
            if [ "${{ inputs.prefect_changed }}" == "true" ]; then
              echo "PREFECT_IMAGE=$REGISTRY/${{ vars.ECR_PREFECT_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
            else
              echo "PREFECT_IMAGE=$REGISTRY/${{ vars.ECR_PREFECT_REPO }}:$BRANCH" >> $GITHUB_ENV
            fi
            echo "POSTGRESQL_IMAGE=$REGISTRY/${{ vars.ECR_POSTGRESQL_REPO }}:$BRANCH" >> $GITHUB_ENV
            if [ "${{ inputs.solr_changed }}" == "true" ]; then
              echo "SOLR_IMAGE=$REGISTRY/${{ vars.ECR_SOLR_REPO }}:${{ github.sha }}" >> $GITHUB_ENV
            else
              echo "SOLR_IMAGE=$REGISTRY/${{ vars.ECR_SOLR_REPO }}:$BRANCH" >> $GITHUB_ENV
            fi
          fi

      - name: Add url(s) to hosts
        run: |
          sudo echo "127.0.0.1 ckan-dev" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 frontend" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 prefect" | sudo tee -a /etc/hosts

      - name: Pull Docker Images
        run: |
          docker pull $CKAN_IMAGE
          docker pull $DATAPUSHER_IMAGE
          docker pull $PREFECT_IMAGE
          docker pull $POSTGRESQL_IMAGE
          docker pull $SOLR_IMAGE

      - name: Set up Docker Containers (without frontend)
        run: |
          docker compose -f docker-compose.test.ci.yml --env-file .env.example up -d ckan-dev db solr redis minio minio-setup
        working-directory: ./ckan-backend-dev

      - name: Wait for CKAN to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:5000/private-admin/en > /dev/null 2>&1; do sleep 2; done'

      - name: Create sysadmin API for Authorization
        run: bash ./ckan-backend-dev/ckan/scripts/cypress_setup.sh

      - name: Get Sysadmin API Key
        id: get-api-key
        run: |
          TOKEN=$(grep -m1 "SYS_ADMIN_API_KEY=" ckan-backend-dev/.env.example | cut -d'=' -f2)
          echo "::add-mask::$TOKEN"
          echo "SYS_ADMIN_API_KEY=$TOKEN" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO }}
          BRANCH: ${{ inputs.branch_name || github.ref_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FRONTEND_SHA_TAG: ${{ github.sha }}-test
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            FRONTEND_TAG="${BRANCH}-${PR_NUMBER}-test"
          else
            FRONTEND_TAG="${BRANCH}-test"
          fi

          docker build \
            --network host \
            --build-arg NEXTAUTH_SECRET="dummy-secret-for-build" \
            --build-arg NEXTAUTH_URL="http://wri-frontend:3000" \
            --build-arg CKAN_URL="http://ckan-dev:5000/private-admin/en" \
            --build-arg NEXT_PUBLIC_CKAN_URL="http://ckan-dev:5000/private-admin/en" \
            --build-arg NEXT_PUBLIC_NEXTAUTH_URL="http://localhost:3000" \
            --build-arg NEXT_PUBLIC_GTM_ID="dummy-gtm-id" \
            --build-arg NEXT_PUBLIC_DISABLE_HOTJAR="disabled" \
            --build-arg NEXT_PUBLIC_HOTJAR_ID="dummy-hotjar-id" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.dummy_mapbox_token_for_ci}" \
            --build-arg OSANO_URL="YOUR_OSANO_URL/osano.js" \
            --build-arg NEXT_PUBLIC_DEPLOYMENT_TYPE="${{ inputs.branch_name || github.ref_name }}" \
            --build-arg SYS_ADMIN_API_KEY="${{ env.SYS_ADMIN_API_KEY }}" \
            -t $REGISTRY/$FRONTEND_REPO:$FRONTEND_TAG \
            -t $REGISTRY/$FRONTEND_REPO:$FRONTEND_SHA_TAG \
            deployment/frontend

          docker push $REGISTRY/$FRONTEND_REPO:$FRONTEND_TAG
          docker push $REGISTRY/$FRONTEND_REPO:$FRONTEND_SHA_TAG

      - name: Tear down containers
        if: always()
        run: docker compose -f docker-compose.test.ci.yml --env-file .env.example down -v --remove-orphans
        working-directory: ./ckan-backend-dev
