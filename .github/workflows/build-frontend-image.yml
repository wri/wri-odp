name: Build and Push Frontend Image

on:
  workflow_dispatch:
    inputs:
      branch_name:
        required: true
        type: string

  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      datapusher_changed:
        required: false
        type: string
        default: 'false'
      ckan_changed:
        required: false
        type: string
        default: 'false'
      prefect_changed:
        required: false
        type: string
        default: 'false'
      solr_changed:
        required: false
        type: string
        default: 'false'

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: deployment/frontend
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_FRONTEND_REPO }}:${{ inputs.branch_name || github.ref_name }}-test
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_FRONTEND_REPO }}:${{ github.sha }}-test
          cache-from: |
            type=gha,scope=frontend-${{ inputs.branch_name || github.ref_name }}
            type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-${{ inputs.branch_name || github.ref_name }}
          build-args: |
            NEXTAUTH_SECRET=dummy-secret-for-build
            NEXTAUTH_URL=http://wri-frontend:3000
            CKAN_URL=http://ckan-dev:5000/private-admin/en
            NEXT_PUBLIC_CKAN_URL=http://ckan-dev:5000/private-admin/en
            NEXT_PUBLIC_NEXTAUTH_URL=http://localhost:3000
            NEXT_PUBLIC_GTM_ID=dummy-gtm-id
            NEXT_PUBLIC_DISABLE_HOTJAR=disabled
            NEXT_PUBLIC_HOTJAR_ID=dummy-hotjar-id
            NEXT_PUBLIC_GFW_API_KEY=dummy-api-key
            NEXT_PUBLIC_MAPBOX_TOKEN=pk.dummy_mapbox_token_for_ci
            OSANO_URL=YOUR_OSANO_URL/osano.js
            NEXT_PUBLIC_DEPLOYMENT_TYPE=${{ inputs.branch_name || github.ref_name }}
